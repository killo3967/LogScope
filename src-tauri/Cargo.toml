[package]
name = "logscope"
version = "0.2.1"
description = "Visor de logs de escritorio"
edition = "2021"
rust-version = "1.77"

[lib]
name = "logscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4"
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4"] }
chardetng = "1.0.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Mismo binario que release, pero conservando simbolos para poder perfilar.
# La optimizacion no se toca a proposito: hay que medir lo que se distribuye.
# Si el perfil sale demasiado plano por inlining de LTO, prueba lto = false.
[profile.profiling]
inherits = "release"
debug = 1
strip = false
